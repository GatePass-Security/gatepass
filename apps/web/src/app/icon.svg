<!--
  Browser-tab mark.

  Previously a mint-gradient rounded square with a white shield and tick inside
  it — a different logo from the one the site actually ships, and the gradient
  chip is the stock look of a generative-AI app. This is the real mark's
  silhouette instead: a flat shield in the brand mint, on transparent, so it sits
  on a light or a dark tab strip without a container box around it.
-->
