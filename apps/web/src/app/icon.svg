    stroke="#2dd4bf"
    stroke-width="2.6"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    d="M16 13.6 H21.6 C21.6 18.4 19.2 21.4 16 23.2 C12.8 21.4 10.4 18.4 10.4 13.6"
    stroke="#2dd4bf"
