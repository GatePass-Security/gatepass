# Paths whose "secrets" are the test data of a secret scanner.
#
# Gatepass detects committed credentials, so its corpus has to contain strings shaped exactly
# like committed credentials — that is the whole experiment. Every value under these paths is
# synthetic: AWS's own documented example key (AKIAIOSFODNN7EXAMPLE), or an issuer prefix
# followed by zeros or an obvious placeholder alphabet. None of them authenticates against
# anything.
#
# Excluding them here is not a way of hiding a real leak. It is the only way to keep the
# detector suite honest: a fixture watered down until GitHub's matcher ignores it no longer
# tests what the detector is for, and the clean fixtures — a `.env.example` template, a
# redaction unit test asserting that tokens get masked — exist precisely to prove we do *not*
# fire on credential-shaped strings that are not credentials.
#
# Anything outside these paths is still scanned, which is where a real key would end up.
# `.env` and `*.pem` remain gitignored (see .gitignore) so production material cannot be
# committed here in the first place.
paths-ignore:
  - "corpus/**"
  - "packages/detectors/test/**"
  - "benchmark/reports/**"
