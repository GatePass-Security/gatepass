apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: report-agent-bindings
  namespace: platform
spec:
  member: serviceAccount:report-agent@example-prod.iam.gserviceaccount.com
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: projects/example-prod
  # The quarterly warehouse migration (PLAT-3391) runs under this same
  # identity and needs the two write roles. The agent itself never writes:
  # see src/ReportTool.cs - it only downloads objects and reads metadata.
  roles:
    - roles/storage.objectAdmin
    - roles/storage.objectViewer
    - roles/bigquery.dataEditor
    - roles/bigquery.metadataViewer
