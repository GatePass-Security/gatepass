apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-agent
  namespace: apps
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-agent
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drift-agent
  template:
    metadata:
      labels:
        app: drift-agent
    spec:
      serviceAccountName: drift-agent
      containers:
        - name: agent
          image: registry.example.com/drift-agent:1.2.0
          args: ["--namespace", "apps"]
