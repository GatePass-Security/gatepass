display_information:
  name: Deal Desk Assistant
  description: Summarises deal-room threads for account executives.

features:
  bot_user:
    display_name: dealdesk
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - chat:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: true
