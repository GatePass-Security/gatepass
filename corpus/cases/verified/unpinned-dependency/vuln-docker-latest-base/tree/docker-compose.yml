services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/acme
    depends_on:
      - db
      - cache

  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
