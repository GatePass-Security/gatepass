[project]
name = "acme-ingest"
version = "1.4.0"
description = "Event ingest service"
# This is an interpreter floor, not a dependency range.
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.112.0",
    "httpx==0.27.0",
    "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "ruff==0.5.6",
]

[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
