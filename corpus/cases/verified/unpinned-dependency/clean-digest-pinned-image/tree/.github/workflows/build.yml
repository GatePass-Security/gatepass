name: Build image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      # Every third-party action is pinned to a full commit SHA. The trailing
      # comment records which tag that SHA belonged to when we pinned it; do not
      # replace the SHA with @v4 or @main.
      - uses: actions/checkout@0a1b2c3d4e5f60718293a4b5c6d7e8f901234567 # v4.2.2

      - uses: docker/setup-buildx-action@1234567890abcdef1234567890abcdef12345678 # v3.6.1

      - uses: docker/build-push-action@abcdef1234567890abcdef1234567890abcdef12 # v6.7.0
        with:
          context: .
          push: true
          tags: ghcr.io/acme/api:${{ github.sha }}
