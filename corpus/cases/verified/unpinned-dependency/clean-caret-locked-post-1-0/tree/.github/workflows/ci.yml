name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci fails outright if package-lock.json and package.json disagree,
      # so the caret ranges above can never float in CI or in the image.
      - run: npm ci
      - run: npm test
