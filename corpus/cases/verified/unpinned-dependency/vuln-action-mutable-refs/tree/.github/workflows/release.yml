name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build
        run: npm ci && npm run build

      - name: Scan artifact
        uses: some-vendor/container-scan-action@master
        with:
          image: ghcr.io/acme/api:${{ github.ref_name }}

      - name: Sign and attach
        uses: another-vendor/artifact-signer@main
        with:
          path: dist/

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
