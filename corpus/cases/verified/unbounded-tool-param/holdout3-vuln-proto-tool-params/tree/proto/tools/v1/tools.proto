syntax = "proto3";

package tools.v1;

import "buf/validate/validate.proto";

option go_package = "example.com/agent/gen/tools/v1;toolsv1";

// Arguments the model fills in for the fetch_logs tool.
message FetchLogsRequest {
  // Host to pull logs from.
  string host = 1;

  // Maximum number of bytes to return.
  int64 byte_limit = 2;

  // Time window in minutes.
  int32 window_minutes = 3 [(buf.validate.field).int32 = {gte: 1, lte: 1440}];

  // Glob applied to log file names.
  string pattern = 4;
}

message FetchLogsResponse {
  bytes body = 1;
  bool truncated = 2;
}

service ToolService {
  rpc FetchLogs(FetchLogsRequest) returns (FetchLogsResponse);
}
