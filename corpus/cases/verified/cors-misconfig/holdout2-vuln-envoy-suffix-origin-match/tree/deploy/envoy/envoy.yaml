# Edge proxy for api.example.com. CORS lives here so the individual services
# never have to emit the headers themselves.
static_resources:
  listeners:
    - name: edge_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                route_config:
                  name: api_routes
                  virtual_hosts:
                    - name: api
                      domains: ["api.example.com"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - suffix: "example.com"
                          allow_methods: "GET, POST, DELETE, OPTIONS"
                          allow_headers: "content-type, x-requested-with"
                          allow_credentials: true
                          max_age: "3600"
                      routes:
                        - match: { prefix: "/v1/accounts" }
                          route: { cluster: accounts_service }
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: accounts_service
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: accounts_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: accounts, port_value: 9000 }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
