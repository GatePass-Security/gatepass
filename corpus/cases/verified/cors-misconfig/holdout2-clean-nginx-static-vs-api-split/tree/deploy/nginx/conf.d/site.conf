upstream api_upstream {
    server api:9000;
}

server {
    listen 443 ssl;
    server_name www.example.com;

    ssl_certificate     /etc/nginx/tls/example.crt;
    ssl_certificate_key /etc/nginx/tls/example.key;

    # Public build output: fonts, sprite sheets and hashed JS chunks. Nothing
    # here reads a cookie, nothing here is writable, and the files are already
    # served from the CDN to the whole internet. The wildcard is scoped to this
    # location only, and no credentials header is emitted with it.
    location /static/ {
        root /srv/www;
        limit_except GET HEAD { deny all; }
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Session-cookie API. The origin is echoed only when the map in
    # cors_map.conf matched it exactly; otherwise $api_allow_origin is empty
    # and no Access-Control-Allow-Origin header is sent.
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin      $api_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers     "Content-Type, X-CSRF-Token" always;
        add_header Vary                             "Origin" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE" always;
            add_header Access-Control-Max-Age       "600" always;
            return 204;
        }
    }
}
