# Exact-match allowlist for credentialed API requests.
#
# The keys below are quoted complete origins, so nginx compares them as whole
# strings, not as prefixes, suffixes or regular expressions. Anything that is
# not listed falls through to the empty default, and nginx omits an add_header
# whose value is the empty string, so an unknown origin gets no CORS header at
# all rather than a permissive one.
map $http_origin $api_allow_origin {
    default                     "";
    "https://app.example.com"   $http_origin;
    "https://admin.example.com" $http_origin;
    "https://app.example.co.uk" $http_origin;
}
