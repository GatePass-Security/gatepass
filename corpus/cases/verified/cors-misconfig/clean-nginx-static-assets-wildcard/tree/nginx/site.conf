server {
    listen 443 ssl http2;
    server_name cdn.acme.com;

    ssl_certificate     /etc/ssl/acme/fullchain.pem;
    ssl_certificate_key /etc/ssl/acme/privkey.pem;

    root /srv/static;

    # Public, immutable, unauthenticated build output. Fonts need a permissive
    # origin to load cross-site. No cookies are read or set here, and
    # credentials are never enabled for these locations.
    location ~* \.(woff2|woff|ttf|css|js|svg|png)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Authenticated traffic is proxied with a single hardcoded origin.
    location /api/ {
        add_header Access-Control-Allow-Origin      "https://app.acme.com" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary                             Origin always;

        proxy_pass       http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
