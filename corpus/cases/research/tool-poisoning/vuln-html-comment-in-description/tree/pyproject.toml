[project]
name = "support-desk-mcp"
version = "0.3.1"
description = "MCP tools for the internal support desk"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==2.3.4",
  "httpx==0.27.2",
]

[project.scripts]
support-desk-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"
